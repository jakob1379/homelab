---
x-traefik-local-env: &traefik-local-env
  DOMAIN: ${DOMAIN:-localhost.me}
x-traefik-common: &traefik-common
  image: traefik:3.6.9
  ports: [80:80, 443:443]
  networks:
    traefik_public:
      aliases: [traefik]
  extra_hosts: [host.docker.internal:host-gateway]
  labels:
    - traefik.enable=true
    # Traefik dashboard
    - traefik.http.routers.api.rule=Host(`traefik.${DOMAIN:-localhost.me}`)
    - traefik.http.routers.api.service=api@internal
    - traefik.http.routers.api.entrypoints=websecure
    - traefik.http.services.traefik.loadbalancer.server.port=8080
    - homepage.group=Networking
    - homepage.name=Traefik
    - homepage.icon=traefik.png
    - homepage.href=https://traefik.${DOMAIN:-localhost.me}
    - homepage.description=Reverse proxy and routing dashboard
    - homepage.siteMonitor=http://traefik:8081/ping
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8081/ping
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
x-traefik-dev-overrides: &traefik-dev-overrides
  profiles: [infra, dev]
  environment:
    <<: *traefik-local-env
  command: [--configFile=/etc/traefik/traefik.yml]
  volumes:
    - type: bind
      source: ../config/traefik/traefik.yml
      target: /etc/traefik/traefik.yml
      read_only: true
      bind:
        create_host_path: false
    - letsencrypt:/letsencrypt
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../config/traefik/dyn:/etc/traefik/dyn:ro
    - ../config/traefik/certs:/etc/traefik/certs:ro
x-traefik-prod-overrides: &traefik-prod-overrides
  profiles: [prod]
  environment:
    DOMAIN: ${DOMAIN:-}
    CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    TRAEFIK_CERTIFICATESRESOLVERS_CFRESOLVER_ACME_EMAIL: ${ACME_EMAIL:-}
  command: [--configFile=/etc/traefik/traefik.yml]
  volumes:
    - type: bind
      source: ../config/traefik/traefik.acme.yml
      target: /etc/traefik/traefik.yml
      read_only: true
      bind:
        create_host_path: false
    - letsencrypt:/letsencrypt
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../config/traefik/dyn:/etc/traefik/dyn:ro
    - ../config/traefik/certs:/etc/traefik/certs:ro
  depends_on:
    prod-check:
      condition: service_completed_successfully
services:
  prod-check:
    profiles: [prod]
    image: busybox:1.37.0
    network_mode: none
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    command:
      - sh
      - -ec
      - |
        test -n "$$DOMAIN" || { echo "Set DOMAIN for production" >&2; exit 1; }
        test -n "$$ACME_EMAIL" || { echo "Set ACME_EMAIL for production" >&2; exit 1; }
        test -n "$$CF_DNS_API_TOKEN" || { echo "Set CF_DNS_API_TOKEN for Cloudflare DNS-01" >&2; exit 1; }
  traefik-dev:
    <<:
      - *traefik-common
      - *traefik-dev-overrides
  traefik:
    <<:
      - *traefik-common
      - *traefik-prod-overrides
  sablier:
    profiles: [infra, dev, prod]
    image: sablierapp/sablier:1.8.1
    command: [start, --provider.name=docker]
    depends_on:
      traefik-dev:
        condition: service_healthy
        required: false
      traefik:
        condition: service_healthy
        required: false
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [traefik_public]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
  whoami:
    profiles: [infra, dev, prod]
    image: traefik/whoami:v1.10.4
    depends_on:
      traefik-dev:
        condition: service_healthy
        required: false
      traefik:
        condition: service_healthy
        required: false
      sablier:
        condition: service_started
    networks: [traefik_public]
    labels:
      - sablier.enable=true
      - sablier.group=default
      - homepage.group=Admin Tools
      - homepage.name=Whoami
      - homepage.icon=whoami.png
      - homepage.href=https://whoami.${DOMAIN:-localhost.me}
      - homepage.description=Check your connection details
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
  adguard:
    profiles: [infra, dev, prod]
    image: adguard/adguardhome:v0.107.55
    depends_on:
      traefik-dev:
        condition: service_healthy
        required: false
      traefik:
        condition: service_healthy
        required: false
    ports:
      - ${ADGUARD_DNS_PORT:-1053}:53/tcp
      - ${ADGUARD_DNS_PORT:-1053}:53/udp
    volumes:
      - adguard_data:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks: [traefik_public]
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.rule=Host(`dns.${DOMAIN:-localhost.me}`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.services.adguard.loadbalancer.server.port=3000
      - homepage.group=Networking
      - homepage.name=AdGuard
      - homepage.icon=adguard-home.png
      - homepage.href=https://dns.${DOMAIN:-localhost.me}
      - homepage.description=Block ads across the whole network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
  netalertx:
    profiles: [infra, dev, prod]
    image: ghcr.io/jokob-sk/netalertx:26.4.6
    network_mode: host
    depends_on:
      traefik-dev:
        condition: service_healthy
        required: false
      traefik:
        condition: service_healthy
        required: false
    volumes: [netalertx_data:/data, /etc/localtime:/etc/localtime:ro]
    tmpfs: ['/tmp:uid=20211,gid=20211,mode=1700']
    read_only: true
    environment:
      - PORT=20211
      - TZ=${TZ:-Europe/Copenhagen}
      - NETALERTX_SCAN_SUBNETS=${NETALERTX_SCAN_SUBNETS:-192.168.1.0/24}
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    labels:
      - homepage.group=Networking
      - homepage.name=NetAlertX
      - homepage.icon=netalertx.png
      - homepage.href=https://netalertx.${DOMAIN:-localhost.me}
      - homepage.description=See what devices are connected to the network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
networks:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true
volumes:
  adguard_data:
  adguard_conf:
  letsencrypt:
  netalertx_data:
