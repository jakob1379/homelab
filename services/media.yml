---
services:
  gluetun:
    profiles: [apps, all]
    image: qmcgaw/gluetun:v3.41.1
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    networks:
      media:
        aliases: [torrent, sonarr, radarr, flaresolverr, byparr]
      traefik_public:
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=${VPN_FREE_ONLY:-on}
      - OPENVPN_USER=${OPENVPN_USER:?Set OPENVPN_USER in .env, direnv, or Dockhand}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:?Set OPENVPN_PASSWORD in .env, direnv,
        or Dockhand}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Netherlands}
      - FIREWALL_INPUT_PORTS=8080,7878,8989,6881,8191,8192
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.torrent.rule=Host(`torrent.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.torrent.entrypoints=websecure
      - traefik.http.routers.torrent.service=torrent
      - traefik.http.services.torrent.loadbalancer.server.port=8080
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.service=sonarr
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.service=radarr
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    restart: unless-stopped
  jellyfin:
    profiles: [apps, all]
    image: linuxserver/jellyfin:10.11.8
    networks: [traefik_public, media]
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - media_data:/data
      - ../config/jellyfin/custom-progress.css:/usr/share/jellyfin/web/custom-progress.css:ro
      - ../config/jellyfin/99-custom-web-css.sh:/custom-cont-init.d/99-custom-web-css.sh:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.middlewares=startup-retry@file
      - traefik.http.routers.jellyfin.service=jellyfin
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - homepage.group=Media & Files
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=https://jellyfin.${DOMAIN:-traefik.me}
      - homepage.description=Stream and manage your media library
    restart: unless-stopped
  seerr:
    profiles: [apps, all]
    image: ghcr.io/seerr-team/seerr:v3.2.0
    init: true
    networks: [traefik_public, media]
    environment: ['TZ=${TZ:-Europe/Copenhagen}', LOG_LEVEL=info, PORT=5055]
    volumes: [seerr_config:/app/config]
    labels:
      - sablier.enable=true
      - sablier.group=seerr
      - homepage.group=Media & Files
      - homepage.name=Seerr
      - homepage.icon=seerr.png
      - homepage.href=https://requests.${DOMAIN:-traefik.me}
      - homepage.description=Find and request movies and shows on demand
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status
          || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  torrent:
    profiles: [apps, all]
    image: lscr.io/linuxserver/qbittorrent:5.1.4-r2-ls448
    network_mode: service:gluetun
    depends_on: [gluetun]
    labels:
      - homepage.group=Streaming Management
      - homepage.name=QBittorrent
      - homepage.icon=qbittorrent.png
      - homepage.href=https://torrent.${DOMAIN:-traefik.me}
      - homepage.description=Torrent client
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes: [qbittorrent_config:/config, media_data:/data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
  sonarr:
    profiles: [apps, all]
    image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls306
    network_mode: service:gluetun
    depends_on: [gluetun, torrent]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
    volumes: [sonarr_config:/config, media_data:/data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - homepage.group=Streaming Management
      - homepage.name=Sonarr
      - homepage.icon=sonarr-dark.png
      - homepage.href=https://sonarr.${DOMAIN:-traefik.me}
      - homepage.description=Track, download, and organize TV series automatically
  radarr:
    profiles: [apps, all]
    image: lscr.io/linuxserver/radarr:6.1.1.10360-ls298
    network_mode: service:gluetun
    depends_on: [gluetun, torrent]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
    volumes: [radarr_config:/config, media_data:/data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - homepage.group=Streaming Management
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=https://radarr.${DOMAIN:-traefik.me}
      - homepage.description=Track, download, and organize movies automatically
  flaresolverr:
    profiles: [apps, all]
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      - HOST=0.0.0.0
      - PORT=8191
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    volumes: [flaresolverr_config:/config]
    restart: unless-stopped
  byparr:
    profiles: [apps, all]
    image: ghcr.io/thephaseless/byparr@sha256:01a46a2865d9a6db5eb8ead04ec0dd33b8fbe233e8565ae70b50d4cc0af4cfb0
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment: [HOST=0.0.0.0, PORT=8192, LOG_LEVEL=INFO]
    restart: unless-stopped
  prowlarr:
    profiles: [apps, all]
    image: lscr.io/linuxserver/prowlarr@sha256:b4204e18666179472225935b443a99cf6c66dcb7bbc2d35034427a3851f13135
    networks: [traefik_public, media]
    environment: [PUID=1000, PGID=1000, TZ=Etc/UTC]
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - homepage.group=Streaming Management
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr.png
      - homepage.href=https://prowlarr.${DOMAIN:-traefik.me}
      - homepage.description=Manage indexers and sync them with Sonarr and Radarr
    volumes: [prowlarr_config:/config]
    restart: unless-stopped
  bazarr:
    profiles: [apps, all]
    image: lscr.io/linuxserver/bazarr@sha256:cb57afc3bd35558e1e7062658f9d4d18a0b4c474f10afe55f0ccfd867025f24f
    networks: [traefik_public, media]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_public
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN:-traefik.me}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - homepage.group=Streaming Management
      - homepage.name=Bazarr
      - homepage.icon=bazarr.png
      - homepage.href=https://bazarr.${DOMAIN:-traefik.me}
      - homepage.description=Manage and download subtitles for Sonarr and Radarr libraries
    volumes: [bazarr_config:/config, media_data:/data]
    restart: unless-stopped
networks:
  media:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true
volumes:
  jellyfin_config:
  jellyfin_cache:
  media_data:
  seerr_config:
  qbittorrent_config:
  sonarr_config:
  radarr_config:
  prowlarr_config:
  bazarr_config:
  flaresolverr_config:
