---
services:
  hermes:
    profiles: [apps, dev, prod]
    image: nousresearch/hermes-agent@sha256:5f07a3d01c7d6c4a6b2c98df634f580a6d12748bfe105cc875835051679cc527
    restart: unless-stopped
    command: gateway run
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Set
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD in .env, direnv, or Dockhand}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Set
        HERMES_DASHBOARD_BASIC_AUTH_SECRET in .env, direnv, or Dockhand}
    volumes: [hermes_data:/opt/data]
    networks: [traefik_public]
    labels:
      - homepage.group=Utilities
      - homepage.name=Hermes
      - homepage.icon=si-hermes
      - homepage.href=https://hermes.${DOMAIN:-localhost.me}
      - homepage.description=Self-hosted AI agent gateway and dashboard
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
networks:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true
volumes:
  hermes_data:
