---
volumes:
  ha_config:
services:
  ha:
    profiles: [apps, service, dev, prod]
    image: homeassistant/home-assistant:2026.7.1
    network_mode: host
    volumes:
      - ha_config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ./automations.yaml:/config/automations.yaml
      - ./scripts.yaml:/config/scripts.yaml:ro
      - ./scenes.yaml:/config/scenes.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - HA_CORS_ORIGIN=https://ha.${DOMAIN:-localhost.me}
    cap_add: [NET_ADMIN, NET_RAW]
    labels:
      - homepage.group=Smart Home
      - homepage.name=Home Assistant
      - homepage.icon=home-assistant.png
      - homepage.href=https://ha.${DOMAIN:-localhost.me}
      - homepage.description=Home automation and device control
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - curl -f -s --max-time 5 http://127.0.0.1:8123/manifest.json
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
