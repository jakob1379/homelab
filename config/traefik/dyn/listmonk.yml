---
http:
  routers:
    # Intentionally always-on; there is no matching Sablier label on the service.
    listmonk:
      rule: Host(`listmonk.{{ env "DOMAIN" }}`)
      entrypoints: [websecure]
      service: listmonk
  services:
    listmonk:
      loadBalancer:
        servers:
          - url: http://listmonk:9000/
