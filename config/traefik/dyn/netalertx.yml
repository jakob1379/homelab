---
http:
  routers:
    netalertx:
      rule: Host(`netalertx.{{ env "DOMAIN" }}`)
      entrypoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: netalertx
      middlewares: [admin-only@file, startup-retry@file]
  services:
    netalertx:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:20211/
