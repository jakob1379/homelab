---
http:
  routers:
    netalertx:
      rule: Host(`netalertx.{{ env "DOMAIN" }}`)
      entrypoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: netalertx
      middlewares: [startup-retry@file]
  services:
    netalertx:
      loadBalancer:
        servers:
          - url: http://netalertx:20211/
